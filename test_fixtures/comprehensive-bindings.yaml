asyncapi: 3.0.0
info:
  title: Comprehensive Bindings Test
  version: 1.0.0
  description: Test fixture covering all binding fields

servers:
  kafka-server:
    host: kafka.example.com:9092
    protocol: kafka
    bindings:
      kafka:
        schemaRegistryUrl: https://schema-registry.example.com
        schemaRegistryVendor: confluent
        bindingVersion: 0.5.0
        x-custom: custom-value

  mqtt-server:
    host: mqtt.example.com:1883
    protocol: mqtt
    bindings:
      mqtt:
        clientId: test-client-id
        cleanSession: true
        keepAlive: 120
        sessionExpiryInterval: 3600
        maximumPacketSize: 65535
        lastWill:
          topic: /will/topic
          qos: 1
          message: Client disconnected unexpectedly
          retain: true
        bindingVersion: 0.2.0

  http-server:
    host: api.example.com:443
    protocol: https
    bindings:
      http:
        x-http-server-ext: value

channels:
  kafka-channel:
    address: events/kafka/{eventId}
    messages:
      kafkaMessage:
        $ref: '#/components/messages/kafkaMessage'
    bindings:
      kafka:
        topic: test-topic
        partitions: 24
        replicas: 3
        topicConfiguration:
          cleanup.policy:
            - delete
            - compact
          retention.ms: 604800000
          retention.bytes: 1073741824
          delete.retention.ms: 86400000
          max.message.bytes: 1048576
          confluent.key.schema.validation: true
          confluent.key.subject.name.strategy: TopicNameStrategy
          confluent.value.schema.validation: true
          confluent.value.subject.name.strategy: TopicRecordNameStrategy
        bindingVersion: 0.5.0

  amqp-channel:
    address: orders/{orderId}
    messages:
      amqpMessage:
        $ref: '#/components/messages/amqpMessage'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: orders-exchange
          type: topic
          durable: true
          autoDelete: false
          vhost: /test
        queue:
          name: orders-queue
          durable: true
          exclusive: false
          autoDelete: false
          vhost: /test
        bindingVersion: 0.3.0

  ws-channel:
    address: /websocket
    messages:
      wsMessage:
        $ref: '#/components/messages/wsMessage'
    bindings:
      ws:
        method: GET
        query:
          type: object
          properties:
            token:
              type: string
        headers:
          type: object
          properties:
            Authorization:
              type: string
        bindingVersion: 0.1.0

  http-channel:
    address: /api/events
    messages:
      httpMessage:
        $ref: '#/components/messages/httpMessage'
    bindings:
      http:
        x-http-channel-ext: value

operations:
  kafka-operation:
    action: receive
    channel:
      $ref: '#/channels/kafka-channel'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - consumer-group-1
            - consumer-group-2
        clientId:
          type: string
          pattern: "^client-[a-z]+$"
        bindingVersion: 0.5.0

  amqp-operation:
    action: receive
    channel:
      $ref: '#/channels/amqp-channel'
    bindings:
      amqp:
        expiration: 30000
        userId: guest
        cc:
          - routing.key.1
          - routing.key.2
        priority: 10
        deliveryMode: 2
        mandatory: true
        bcc:
          - hidden.key.1
          - hidden.key.2
        timestamp: true
        ack: true
        bindingVersion: 0.3.0

  mqtt-operation:
    action: send
    channel:
      $ref: '#/channels/kafka-channel'
    bindings:
      mqtt:
        qos: 2
        retain: true
        bindingVersion: 0.2.0

  http-operation:
    action: send
    channel:
      $ref: '#/channels/http-channel'
    bindings:
      http:
        method: POST
        query:
          type: object
          properties:
            page:
              type: integer
        bindingVersion: 0.3.0

components:
  messages:
    kafkaMessage:
      name: kafkaMessage
      contentType: application/json
      payload:
        type: object
        properties:
          data:
            type: string
      bindings:
        kafka:
          key:
            type: string
            format: uuid
          schemaIdLocation: header
          schemaIdPayloadEncoding: confluent
          schemaLookupStrategy: TopicIdStrategy
          bindingVersion: 0.5.0

    amqpMessage:
      name: amqpMessage
      contentType: application/json
      payload:
        type: object
        properties:
          data:
            type: string
      bindings:
        amqp:
          contentEncoding: utf-8
          messageType: order.created
          bindingVersion: 0.3.0

    mqttMessage:
      name: mqttMessage
      contentType: application/json
      payload:
        type: object
        properties:
          data:
            type: string
      bindings:
        mqtt:
          payloadFormatIndicator: 1
          correlationData:
            type: string
            format: uuid
          contentType: application/json
          responseTopic: /response/topic
          bindingVersion: 0.2.0

    httpMessage:
      name: httpMessage
      contentType: application/json
      payload:
        type: object
        properties:
          data:
            type: string
      bindings:
        http:
          headers:
            type: object
            properties:
              Content-Type:
                type: string
          statusCode: 200
          bindingVersion: 0.3.0

    wsMessage:
      name: wsMessage
      contentType: application/json
      payload:
        type: object
        properties:
          data:
            type: string
